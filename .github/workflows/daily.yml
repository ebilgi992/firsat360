# FIRSAT360 — canlı günlük veri hattı (sunucu tarafı zamanlama)
#
# Günde iki kez (07:05 ve 18:05 Türkiye saati) tüm mağazaların resmî kaynaklarını kontrol eder, ürün görsellerini
# doğrular, yeni katalogları bir kez duyurur, isteğe bağlı ntfy push'u 09:00'a zamanlar ve feed.json'u GitHub Pages'te
# yayımlar. Uygulama veriyi https://<kullanıcı>.github.io/<depo>/feed.json adresinden alır.
#
# Durum (SQLite veritabanı, HTTP doğrulayıcıları, kısa günlükler) "veri" dalında tek bir commit olarak tutulur
# (her çalıştırmada üzerine yazılır → depo büyümez). Gizli anahtarlar yalnızca GitHub Secrets'tadır, APK'da yoktur.
name: gunluk-veri

on:
  schedule:
    - cron: "5 4 * * *"    # 07:05 Europe/Istanbul (UTC+3)
    - cron: "5 15 * * *"   # 18:05 Europe/Istanbul
  workflow_dispatch:
    inputs:
      no_pages:
        description: "Ürün sayfası görsel doğrulamasını atla"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gunluk-veri
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Önceki durumu al (veri dalı)
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin veri >/dev/null 2>&1; then
            git fetch --depth=1 origin veri
            git --work-tree=state checkout origin/veri -- . || true
            git reset -q
          fi
          ls -la state || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r backend/requirements.txt

      - name: Günlük senkronizasyon
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/state/firsat360.db
          FEED_EXPORT_PATH: ${{ github.workspace }}/site/feed.json
          HTTP_CACHE_DIR: ${{ github.workspace }}/state/http-cache
          LOG_DIR: ${{ github.workspace }}/state/logs
          LOG_MAX_BYTES: "5242880"
          LOG_KEEP_DAYS: "7"
          NOTIFY_TIME: ${{ vars.NOTIFY_TIME || '09:00' }}
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT || 'FIRSAT360Bot/0.5 (+https://github.com/firsat360)' }}
          MIN_REQUEST_INTERVAL_S: "3"
          PRODUCT_PAGES_PER_STORE: ${{ vars.PRODUCT_PAGES_PER_STORE || '150' }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.no_pages }}" = "true" ]; then ARGS="--no-pages"; fi
          python -m firsat360 daily $ARGS | tee ../site-report.json

      - name: Gizlilik politikasını yayına ekle
        if: always()
        run: mkdir -p site && cp docs/privacy.html site/privacy.html

      - name: Durum özetini iş sayfasına yaz
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          p = pathlib.Path("site/status.json")
          if not p.exists():
              print("status.json üretilmedi"); raise SystemExit
          st = json.loads(p.read_text(encoding="utf-8"))
          print("| Mağaza | Durum | Son başarılı | Son hata |\n|---|---|---|---|")
          for s in st["stores"]:
              print(f"| {s['name']} | {s['status']} | {s['last_success_at'] or '-'} | {(s['last_error'] or '')[:80]} |")
          PY

      - name: Durumu kaydet (veri dalı, tek commit)
        if: always()
        run: |
          cd state
          rm -rf .git
          git init -q -b veri
          git config user.name "firsat360-bot"
          git config user.email "firsat360-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "durum $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri

      # Kaynaklar başarısız olsa bile son doğrulanmış veriyle üretilen feed yayımlanır.
      - uses: actions/configure-pages@v5
        if: always() && hashFiles('site/feed.json') != ''
      - uses: actions/upload-pages-artifact@v3
        if: always() && hashFiles('site/feed.json') != ''
        with:
          path: site
      - id: deploy
        if: always() && hashFiles('site/feed.json') != ''
        uses: actions/deploy-pages@v4
